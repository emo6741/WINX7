name: Build Windows 7 APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q NOVA-WebView-GitHub.zip -d project

          echo "=== ZIP CONTENT ==="
          find project -maxdepth 5 -type f | head -200

      - name: Find Android project
        run: |
          PROJECT=$(find project -name build.gradle -o -name build.gradle.kts | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Android Gradle projesi bulunamadı!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          cd "$PROJECT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Windows7-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
